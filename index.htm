
<audio id="weddingMusic" loop preload="auto" autoplay>
  <source
    src="https://baseldaaboul83-droid.github.io/ivory-swans-wedding/Wedding%20day.%20Ave%20Maria%20and%20Azan.m4a"
    type="audio/mp4">
</audio>

<script>
  const music = document.getElementById("weddingMusic");

  function startMusic() {
    music.play().catch(() => {});
    document.removeEventListener("click", startMusic);
    document.removeEventListener("touchstart", startMusic);
  }

  music.play().catch(() => {});

  document.addEventListener("click", startMusic);
  document.addEventListener("touchstart", startMusic);
</script>
