
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f3e9">
  <title>خطوبة باسل ولين</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tahoma", sans-serif;
      color: #65543c;
      text-align: center;
      background:
        radial-gradient(circle at top, #fffdf7, #eee5d5 75%);
      overflow-x: hidden;
    }

    .page {
      width: min(94%, 650px);
      margin: 25px auto;
      padding: 25px 18px 35px;
      border: 2px solid #c6a45c;
      outline: 1px solid #e4d3a9;
      outline-offset: 5px;
      border-radius: 18px;
      background: rgba(255, 253, 247, 0.94);
      box-shadow: 0 12px 40px #78643b25;
      animation: appear 1.5s ease both;
      position: relative;
    }

    h1 {
      color: #b18b43;
      font-size: clamp(27px, 6vw, 38px);
      margin: 12px 0 20px;
      font-weight: normal;
    }

    .subtitle {
      font-size: 19px;
      line-height: 2;
      color: #88734f;
    }

    .names {
      margin: 20px 0;
      color: #a78340;
      font-size: clamp(25px, 6vw, 35px);
      line-height: 1.9;
      font-weight: bold;
    }

    .ampersand {
      color: #8ba7b2;
      font-size: 25px;
    }

    .divider {
      width: 65%;
      height: 1px;
      margin: 22px auto;
      background: linear-gradient(to right, transparent, #c6a45c, transparent);
    }

    .invitation-image {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      margin: 20px auto;
      border-radius: 12px;
      box-shadow: 0 7px 22px #8b744333;
      border: 1px solid #d8c28e;
    }

    .date {
      font-size: 23px;
      color: #a78340;
      line-height: 1.9;
      font-weight: bold;
    }

    .details {
      font-size: 18px;
      line-height: 2.2;
      color: #75664d;
    }

    .blessing {
      font-size: 19px;
      line-height: 2;
      color: #8a744e;
      margin-top: 25px;
    }

    .countdown-title {
      color: #a78340;
      font-size: 20px;
      margin-top: 28px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      margin: 18px auto;
      direction: rtl;
    }

    .time-box {
      background: #f1eadb;
      border: 1px solid #d4bd86;
      border-radius: 10px;
      padding: 12px 8px;
      min-width: 70px;
      color: #8b7040;
    }

    .time-box strong {
      display: block;
      font-size: 25px;
    }

    .time-box span {
      font-size: 12px;
    }

    .music-button {
      background: linear-gradient(135deg, #c6a45c, #9c7939);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 13px 27px;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
      box-shadow: 0 4px 12px #9c793944;
    }

    .music-button:active {
      transform: scale(.97);
    }

    .footer {
      color: #9c8b6c;
      font-size: 13px;
      margin-top: 28px;
    }

    .bird {
      position: fixed;
      z-index: 5;
      top: 15%;
      right: -60px;
      font-size: 28px;
      pointer-events: none;
      animation: fly 12s linear infinite;
      opacity: 0;
    }

    .bird.two {
      top: 32%;
      animation-delay: 4s;
      font-size: 22px;
    }

    .bird.three {
      top: 48%;
      animation-delay: 8s;
      font-size: 25px;
    }

    .sparkle {
      position: fixed;
      color: #c6a45c;
      pointer-events: none;
      animation: sparkle 3s ease-in-out infinite;
    }

    .sparkle.one {
      top: 18%;
      left: 8%;
    }

    .sparkle.two {
      top: 65%;
      right: 7%;
      animation-delay: 1s;
    }

    @keyframes fly {
      0% {
        transform: translateX(0) translateY(0);
        opacity: 0;
      }
      10% {
        opacity: .8;
      }
      90% {
        opacity: .8;
      }
      100% {
        transform: translateX(-120vw) translateY(-45px);
        opacity: 0;
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: .2;
        transform: scale(.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 400px) {
      .page {
        padding: 20px 12px;
      }

      .time-box {
        min-width: 62px;
      }
    }
  </style>
</head>

<body>

  <div class="bird">🕊️</div>
  <div class="bird two">🕊️</div>
  <div class="bird three">🕊️</div>
  <div class="sparkle one">✦</div>
  <div class="sparkle two">✧</div>

  <main class="page">

    <h1>على أجنحة الفرح</h1>

    <div class="subtitle">
      ندعوكم لمشاركتنا بداية حكاية كل من
    </div>

    <div class="names">
      باسل جابر دعبول
      <div class="ampersand">و</div>
      لين محمد عثمان
    </div>

    <div class="divider"></div>

    <img
      class="invitation-image"
      src="0BE13247-96C3-4BD3-8025-56FE000D0E79.png"
      alt="دعوة خطوبة باسل ولين"
    >

    <div class="divider"></div>

    <div class="date">
      الأربعاء 9 ديسمبر 2026
    </div>

    <div class="details">
      الساعة الثانية ظهرًا<br>
      اللاذقية – منتجع النبع السياحي
    </div>

    <div class="blessing">
      بارك الله لهما وبارك عليهما<br>
      وجمع بينهما في خير
    </div>

    <div class="divider"></div>

    <div class="countdown-title">
      بقي على فرحتنا
    </div>

    <div class="countdown">
      <div class="time-box">
        <strong id="days">--</strong>
        <span>يوم</span>
      </div>

      <div class="time-box">
        <strong id="hours">--</strong>
        <span>ساعة</span>
      </div>

      <div class="time-box">
        <strong id="minutes">--</strong>
        <span>دقيقة</span>
      </div>

      <div class="time-box">
        <strong id="seconds">--</strong>
        <span>ثانية</span>
      </div>
    </div>

    <button class="music-button" id="musicButton">
      ♫ تشغيل الموسيقى
    </button>

    <div class="footer">
      بكل الحب ننتظر مشاركتكم فرحتنا
    </div>

  </main>

  <audio id="music" loop preload="none">
    <source src="Wedding%20day.%20Ave%20Maria%20and%20Azan.m4a" type="audio/mp4">
  </audio>

  <script>
    // موعد الخطوبة: الأربعاء 9 ديسمبر 2026 الساعة 2 ظهرًا
    const eventDate =
      new Date("2026-12-09T14:00:00+03:00").getTime();

    function updateCountdown() {
      const now = Date.now();
      const difference = eventDate - now;

      if (difference <= 0) {
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        document.getElementById("minutes").textContent = "0";
        document.getElementById("seconds").textContent = "0";
        return;
      }

      const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );

      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );

      const seconds = Math.floor(
        (difference / 1000) % 60
      );

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const music = document.getElementById("music");
    const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", async function () {
      if (music.paused) {
        try {
          await music.play();
          musicButton.textContent = "♫ إيقاف الموسيقى";
        } catch (error) {
          musicButton.textContent = "تعذّر تشغيل الموسيقى";
        }
      } else {
        music.pause();
        musicButton.textContent = "♫ تشغيل الموسيقى";
      }
    });
  </script>

</body>
</html>
