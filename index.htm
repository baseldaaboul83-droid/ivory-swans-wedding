

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة خطوبة باسل ولين</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px 40px;
      background: linear-gradient(145deg, #f8f2e8, #e9e3d7, #dce7e8);
      color: #65543d;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 25px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(80, 65, 40, 0.18);
    }

    .countdown-box {
      padding: 24px 15px;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #d6bd8a;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(80, 65, 40, 0.08);
    }

    h2 {
      color: #9b7940;
      font-size: 23px;
      margin: 0 0 22px;
    }

    .countdown {
      display: flex;
      direction: ltr;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .time-unit {
      min-width: 65px;
      padding: 13px 8px;
      background: #f3eadb;
      border: 1px solid #d6bd8a;
      border-radius: 12px;
    }

    .number {
      display: block;
      direction: ltr;
      unicode-bidi: isolate;
      font-size: 27px;
      font-weight: bold;
      color: #8b6a35;
      font-variant-numeric: lining-nums;
    }

    .unit-label {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      color: #76664e;
    }

    .details {
      line-height: 2;
      font-size: 17px;
      margin: 22px 0;
    }

    .music-button {
      display: inline-block;
      padding: 13px 27px;
      border: none;
      border-radius: 30px;
      background: #a88a55;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }

    .music-button:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 25px;
      color: #8b774f;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      class="poster"
      src="https://baseldaaboul83-droid.github.io/ivory-swans-wedding/0BE13247-96C3-4BD3-8025-56FE000D0E79.png"
      alt="دعوة خطوبة باسل ولين"
    >

    <section class="countdown-box">
      <h2>باقي على فرحتنا</h2>

      <div class="countdown">
        <div class="time-unit">
          <span class="number" id="days">--</span>
          <span class="unit-label">يوم</span>
        </div>

        <div class="time-unit">
          <span class="number" id="hours">--</span>
          <span class="unit-label">ساعة</span>
        </div>

        <div class="time-unit">
          <span class="number" id="minutes">--</span>
          <span class="unit-label">دقيقة</span>
        </div>

        <div class="time-unit">
          <span class="number" id="seconds">--</span>
          <span class="unit-label">ثانية</span>
        </div>
      </div>
    </section>

    <div class="details">
      <div>باسل جابر دعبول</div>
      <div>♡</div>
      <div>لين محمد عثمان</div>
      <br>
      <div>الخميس 10 ديسمبر 2026</div>
      <div>الساعة الثانية ظهرًا</div>
      <div>اللاذقية – منتجع النبع السياحي</div>
    </div>

    <button class="music-button" id="musicButton">
      ▶ تشغيل موسيقى الدعوة
    </button>

    <audio id="weddingMusic" loop preload="metadata">
      <source
        src="https://baseldaaboul83-droid.github.io/ivory-swans-wedding/Wedding%20day.%20Ave%20Maria%20and%20Azan.m4a"
        type="audio/mp4"
      >
    </audio>

    <div class="footer">
      حضوركم يزيد فرحتنا جمالًا ❤️
    </div>

  </main>

  <script>
    const eventDate = new Date("2026-12-10T14:00:00+03:00").getTime();

    function updateCountdown() {
      const now = Date.now();
      let difference = eventDate - now;

      if (difference <= 0) {
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        document.getElementById("minutes").textContent = "0";
        document.getElementById("seconds").textContent = "0";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((difference / (1000 * 60)) % 60);
      const seconds = Math.floor((difference / 1000) % 60);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const music = document.getElementById("weddingMusic");
    const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", async function () {
      if (music.paused) {
        try {
          await music.play();
          musicButton.textContent = "❚❚ إيقاف الموسيقى";
        } catch (error) {
          musicButton.textContent = "تعذّر تشغيل الموسيقى";
        }
      } else {
        music.pause();
        musicButton.textContent = "▶ تشغيل موسيقى الدعوة";
      }
    });
  </script>

</body>
</html>
